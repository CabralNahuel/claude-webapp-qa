name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test (manifests, SKILL.md files, evals, responsive-check on fixtures)
        run: node tools/smoke_test.mjs --browser
      - name: Check scripts parse
        run: for f in skills/*/scripts/*.mjs tools/*.mjs; do node --check "$f"; done
