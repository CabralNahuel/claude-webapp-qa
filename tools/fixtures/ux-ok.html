<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX ok fixture</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; padding: 16px; }
  .primary { background: #1f7fcc; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; }
  .ghost { background: transparent; border: 1px solid #888; border-radius: 10px; padding: 12px 18px; }
  :focus-visible { outline: 3px solid #e08600; outline-offset: 2px; }
  li { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
</style>
</head>
<body>
  <h1>Matches</h1>
  <button class="primary">Save result</button>
  <button class="ghost">Invite players</button>
  <ul>
    <li>Match A <button class="ghost" onclick="if (confirm('Delete match A?')) this.closest('li').remove()">Delete match</button></li>
  </ul>
  <label for="name">Player name</label> <input id="name">
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" width="40" height="40">
</body>
</html>
